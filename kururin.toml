# Kuru Kuru Kururin (Europe) -- project configuration.
#
# Read by scripts/discover_functions.py (function discovery) and
# scripts/generate_asm.py (asm/ + src/ generation). Addresses are ROM addresses.

[rom]
sha1 = "6025ef597db2684ae064ffe22b4fd1d37941f887"
size = 0x400000
# 0x08000000-0x080000BF is the cartridge header; ARM start-up code follows.
thumb_start = 0x080002D8
# AgbMain: the Thumb entry crt0 calls through `ldr r1, =AgbMain+1; bx r1`.
agbmain = 0x080002D8
# First byte after the code region. Everything from here on is incbin'd data.
code_end = 0x0801CB64

# Hand-written ARM routines (crt0 + interrupt code). Luvdis only disassembles
# Thumb, so these are emitted by scripts/generate_asm.py as ARM .inst words.
[[arm_functions]]
start = 0x080000C0
name = "start_vector"

[[arm_functions]]
start = 0x080000FC
name = "IntrMain"

[[arm_functions]]
start = 0x0800019C

[[arm_functions]]
start = 0x080001DC

# Hand-written assembly. Discovery exempts these from the tiling check (their
# routines may share code, fall into each other and switch to ARM mode), and
# scripts/difficulty.py counts their functions as asm, not C targets.
# In an asm module (m4a_1) the region is emitted as one .s file. Inside a C module
# a region is a function whose original source was inline asm: it stays an
# INCLUDE_ASM for good (CLAUDE.md rule 5 forbids inline asm).
[[asm_regions]]
name = "m4a_1"   # MusicPlayer2000 m4a_1.s: umul3232H32, SoundMain, SoundMainRAM, ... TrackStop, ply_*
start = 0x0801A528
end = 0x0801B11C

[[asm_regions]]
name = "MultiBootWaitCycles"   # SDK multiboot.c: NAKED asm; `mov r2, pc` tells ROM from RAM
start = 0x0801A1FC
end = 0x0801A214

[[asm_regions]]
name = "MusicPlayerJumpTableCopy"   # SDK m4a.c: asm("swi 0x2A"); agbcc has no svc builtin
start = 0x0801B56C
end = 0x0801B570

# Link order. `kind` is
#   header  the cartridge header (incbin)
#   asm     one generated .s file (hand-written code: ARM, m4a_1.s, BIOS stubs)
#   c       src/<name>.c, one INCLUDE_ASM per function until decompiled
#   lib     members of agbcc's own libgcc.a / libc.a, linked as they are (their
#           bytes are identical to the ROM's)
#   data    incbin'd data (everything after the code)
# `cc` (agbcc or old_agbcc) and `cflags` are per translation unit, as the original
# build had them -- never per function -- and every C module must give both (a module
# split off another takes the parent's). Each choice records its evidence:
# tests/compiler_evidence/<module>/ holds C that `make compare` (scripts/
# check_compilers.py) compiles with the setting, which must match, and with each other
# candidate (agbcc, agbcc -fprologue-bugfix, old_agbcc at -O and -O2), at least one of
# which must not; a module it cannot decide yet carries `unverified = "<reason>"`.
# Two differences tell the compilers apart:
#   * a leaf function that contains a branch: plain agbcc saves lr in it (push {lr} ...
#     pop {rN}; bx rN); old_agbcc and agbcc -fprologue-bugfix return with a bare bx lr;
#   * old_agbcc's s_register_operand (tools/agbcc-src/gcc/thumb.c, OLD_COMPILER) accepts
#     (subreg (mem)), so a single-use ldrb/ldrh is folded into the and/orr/add that uses
#     it and reloaded right next to it; agbcc keeps the load where the source has it.
[[modules]]
name = "rom_header"
kind = "header"
start = 0x08000000

[[modules]]
name = "crt0"        # start_vector, IntrMain + two ARM interrupt routines
kind = "asm"
start = 0x080000C0

# The game's own code is one C module per subsystem (docs/modules.md): contiguous ranges, in
# ROM order, split for readability; the original translation units are not known. All of them
# have the setting the provisional unit `game` had and share its evidence (`evidence = "game"`,
# tests/compiler_evidence/game, checked as one group):
# verified: Util_StepTowards (util), a leaf with branches that saves no registers and ends in a
# bare bx lr (as do all 7 such leaves in the game), rules out plain agbcc; Sprite_DebugTileGrid
# (sprite) keeps its ldrh before the and, which rules out old_agbcc (90.91%). Every
# calibration function in the game matches with this setting.
[[modules]]
name = "main"
# the entry, the frame loop, interrupts, keys, the frame callbacks, the transfer queue and the heap
kind = "c"
evidence = "game"
cc = "agbcc"
cflags = "-mthumb-interwork -Wimplicit -Wparentheses -O2 -fhex-asm -fprologue-bugfix"
start = 0x080002D8

