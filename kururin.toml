kind = "lib"
archive = "libc.a"
members = ["memcpy.o", "memset.o", "strcmp.o", "strcpy.o"]
start = 0x0801CA08

[[modules]]
name = "data"        # all read-only data after the code; split as it is understood
kind = "data"
start = 0x0801CB64

[overrides]
# Entry points discovery cannot find on its own (each needs a comment saying why).
functions = []
# Candidates that discovery accepts but are not functions.
not_functions = []
# Functions that never return (in addition to those detected automatically).
noreturn = []
# BL targets that are long-branch labels inside their caller (in addition to
# those detected automatically).
farjumps = []
# Data inside the code region, as [start, end] pairs. Discovery fails unless the
# data it finds is exactly this list, so an entry needs a comment saying what it is.
data_in_code = []

# Function names (address -> name). Every name needs evidence; see CLAUDE.md.
[renames]
0x080002D8 = "AgbMain"
0x0800044C = "IntrDummy"           # fills the IRQ table AgbMain copies to IWRAM 0x030008B0
0x080004EC = "Main_ClearFrameCallback"  # gMain.frameCallback = NULL (nothing calls it); ClearFrameCallback until the deep review gave it the module prefix
# MusicPlayer2000 (Nintendo SDK sound engine): identified by code shape and order,
# which match the SDK's m4a_1.s / m4a.c as reconstructed by pret's projects.
0x0801A528 = "umul3232H32"         # adr/bx to ARM umull
0x0801A538 = "SoundMain"           # checks the 'Smsh' ID, calls SoundMainRAM in IWRAM
0x0801A5BC = "SoundMainRAM"        # mixer; copied to IWRAM, switches to ARM
0x0801ABC4 = "MPlayMain"           # MPlayOpen installs it as SoundInfo.MPlayMainHead
0x0801A9C8 = "MPlayJumpTableCopy"  # SoundInit: copies the BIOS's jump list into gMPlayJumpTable
0x0801AE30 = "TrackStop"           # calls CgbOscOff through `bl call_r3`
0x0801AE74 = "ply_note"            # SoundInit installs it as SoundInfo.plynote
0x0801B08C = "ply_endtie"          # MPlayExtender: gMPlayJumpTable[29]
0x0801B0F4 = "ply_lfos"            # MPlayExtender: gMPlayJumpTable[17]
0x0801B108 = "ply_mod"             # MPlayExtender: gMPlayJumpTable[19]
0x0801B11C = "MidiKeyToFreq"       # the only caller of umul3232H32
0x0801B180 = "UnusedDummyFunc"
0x0801B184 = "MPlayContinue"       # clears bit 31 of status if ident == 'Smsh'
0x0801B1A0 = "MPlayFadeOut"
0x0801B3B8 = "m4aMPlayContinue"    # SDK wrapper: MPlayContinue(mplayInfo)
0x0801B3F0 = "m4aMPlayFadeOut"     # SDK wrapper: MPlayFadeOut(mplayInfo, (u16)speed)
0x0801B448 = "MPlayExtender"       # sets SOUNDCNT_X, fills gMPlayJumpTable (0x03005830)
0x0801B56C = "MusicPlayerJumpTableCopy"  # svc 0x2A (SoundGetJumpList)
0x0801B570 = "ClearChain"          # calls gMPlayJumpTable[34]
0x0801B584 = "Clear64byte"         # calls gMPlayJumpTable[35]
0x0801BC24 = "CgbModVol"           # pret's SDK C (with CgbPan) matches: tests/compiler_evidence/m4a
# The rest of m4a.c: each function byte-matches pret's (pokeemerald m4a.c) function of
# that name, in the same order, adapted to this older revision (src/m4a.c)
