# Absolute ROM pointers inside the data: scripts/find_pointers.py (needs `make pointer-evidence`)
# writes them to config/data_pointers.txt, and scripts/generate_asm.py emits each one as a
# symbol so the linker relocates it (`make shift-test` proves it). See find_pointers.py.
# Numbers the original build defined in its linker script and the code loads from literal
# pools: m4a.c's NUM_MUSIC_PLAYERS ((u16)gNumMusicPlayers) and MAX_LINES ((u32)gMaxLines), as
# in pret's projects (ld_script.txt). `pools`: the pool words that hold them.
[linker_constants]
gNumMusicPlayers = { value = 4, pools = [0x0801B240, 0x0801B3B0, 0x0801B3E8] }  # m4aSoundInit, m4aMPlayAllStop, m4aMPlayAllContinue
gMaxLines = { value = 0, pools = [0x0801B564] }  # MPlayExtender

# Data that a C module's .rodata provides (scripts/generate_asm.py): once every function of
# `functions` is C, the linker places src/<module>.o(.rodata) at start (it must be exactly
# end - start bytes) instead of the incbin; until then the module must emit no .rodata.
[[rodata]]
# agb_sram's version string "SRAM_V111", then the 4 words agbcc puts in .rodata for the
# (otherwise folded) function address differences of ReadSram and VerifySram
module = "agb_sram"
start = 0x080C2798
end = 0x080C27B4
functions = ["ReadSram", "VerifySram"]

[pointers]
# m4a's gSongTable: the operand of m4aSongNumStart & co. (m4aSongNumStart..m4aSongNumContinue)
song_table = 0x08021088
# Where the game's (and m4a's) pointer tables are, as [start, end) pairs. Outside these and
# the parsed m4a songs everything is graphics, maps or samples: in a full run of the
# tests/gameplay inputs the original loads no ROM-valued word there with ldr/ldm.
ranges = [
    # first data byte (IntrMain's IRQ table) .. the first wave sample (voice group 0x0801F5AC)
    [0x0801CB64, 0x08021320],
    # after the last m4a song .. the first of the 4 graphics blocks gUnk_0801E82C points at
    [0x080C2798, 0x080C63FC],
]
# Words in the ranges that hold a ROM address but are not pointers (each with a reason).
not_pointers = []

# Data symbols (name = address): RAM ones are written into the linker script, ROM ones are
# labels in data/data.s (instead of gUnk_<address>). Pool words in the generated asm that
# equal one of these addresses are emitted as the symbol.
[symbols]
gMain = 0x03000DC0            # main-loop state; +0 is KururinTAS's "Global Frame Counter"
# m4a.c's RAM objects and tables (pret's names; the SDK functions that use them byte-match)
SoundMainRAM_Buffer = 0x03000490  # char[0x400]: m4aSoundInit copies SoundMainRAM here
gSoundInfo = 0x03004880       # struct SoundInfo; SOUND_INFO_PTR (0x03007FF0) points here
gMPlayJumpTable = 0x03005830  # MPlayFunc[36]
gCgbChans = 0x030058C0        # struct CgbChannel[4]
gMPlayMemAccArea = 0x03005A80 # u8[0x10]
gScaleTable = 0x0801F364      # MidiKeyToFreq
gFreqTable = 0x0801F418       # MidiKeyToFreq
gPcmSamplesPerVBlankTable = 0x0801F448  # SampleFreqSet
gCgbScaleTable = 0x0801F460   # MidiKeyToCgbFreq
gCgbFreqTable = 0x0801F4E4    # MidiKeyToCgbFreq
gNoiseTable = 0x0801F4FC      # MidiKeyToCgbFreq
gCgb3Vol = 0x0801F538         # CgbSound
gXcmdTable = 0x0801F57C       # ply_xcmd
gMPlayTable = 0x08021058      # struct MusicPlayer[4]: m4aSoundInit, m4aSongNumStart & co.
gSongTable = 0x08021088       # struct Song[]: m4aSongNumStart & co. ([pointers] song_table)
MultiBoot_required_data = 0x03000028  # u16[MULTIBOOT_NCHILD]: the SDK multiboot.c static, matched by MultiBootMain
gHudHurtAnim = 0x03000018  # struct Anim: runs gHudHurtFrames when the Helirin is damaging (flags 0x808 == 0x800; KururinTAS kkk.txt bit 11 'Damaging (set the sprite of the face)'), with the hurt face gHudFaceTiles[6] (Hud_Draw)
gHudFaceAnim = 0x03000020  # struct Anim: the HUD face's animation; each new frame copies gHudFaceTiles[value] to OBJ VRAM 0x06010B40, the face sprite's tiles (Hud_Draw)
gTextPressStart = 0x0801E4B4  # "PRESS START": the title's blinking text (Intro_MenuItem)
gLinkStatus = 0x030008EC  # u32, Link_Exchange's result: bits 0-3 the players whose data arrived, 4-6 and 0x80 (the parent) the link's state, bits 8-11 Link_Init's argument
gLinkRecvData = 0x03000D50  # struct LinkData[4]: what each player sent (Link_Exchange), each enabled by a bit 0-3 of gLinkStatus (Link_FindCommand)
gRandomTable = 0x03004280  # u8[256]: the random byte table (Random_Next, Random_Shuffle), reset from gRandomTableInit
gTaskHeap = 0x03004260  # struct Heap the tasks come from: Task_Init sets it up on 0x0203E000 (0x2000 bytes), Task_Create/Task_Destroy allocate and free
gTaskCount = 0x03004250  # s32, the tasks allocated from gTaskHeap: +1 in Task_Create, -1 in Task_Destroy, 0 in Task_Init
gLivesSettings = 0x03004520  # struct LivesSettings (12 bytes), set from gDefaultLivesSettings by Lives_Reset; Lives_Init gives a Helirin its lives and size from it by mode
gDefaultLivesSettings = 0x080C4870  # struct LivesSettings, the initial gLivesSettings (Lives_Reset)
gCamera = 0x030043B0          # include/variables.h: .wch "Cam Bound L/R/T/B" at +0x1C..+0x22
gGameState = 0x03004420       # include/variables.h: .wch "World", "Level", flags at +0x20
gHelirins = 0x03004530        # include/variables.h: 4 x 0xCC-byte players; .wch fields of player 0
gRandomIndex = 0x03004380  # u8, the next entry of gRandomTable Random_Next returns
gVsCourseOrder = 0x030044E0  # u8[55], a permutation of 0..54, the Challenge courses (Vs_ShuffleCourses), swapped by Vs_NextCourse
gVsCourseIndex = 0x03004518  # s32, index into gVsCourseOrder, 0..54 (Vs_NextCourse)
gRandomIndex2 = 0x03004384  # u8, the second index into gRandomTable (Random_Next2)
gFrameHundredths = 0x0801CB9C  # u8[60], the hundredths of a second of each frame of a second (Text_FormatTime)
gDakutenChars = 0x0801CBD8  # u16[128] by code - 0x80: the character code + dakuten (0xDE, JIS X 0201's mark) gives, or code itself (Text_Draw, Text_GetDakutenChar)
gHandakutenChars = 0x0801CCD8  # u16[128] by code - 0x80: the character code + handakuten (0xDF) gives, or code itself (Text_Draw, Text_GetHandakutenChar)
