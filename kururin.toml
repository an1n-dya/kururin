# wrote them only at -O (like pret's agb_flash); at -O2 the loops and registers differ
cflags = "-mthumb-interwork -Wimplicit -Wparentheses -O -fhex-asm"
start = 0x0801C5D0

[[modules]]
name = "libgcc"      # byte-identical to agbcc's libgcc.a members
kind = "lib"
archive = "libgcc.a"
members = ["_call_via_rX.o", "_divsi3.o", "_dvmd_tls.o", "_modsi3.o", "_udivsi3.o", "_umodsi3.o"]
start = 0x0801C72C

[[modules]]
