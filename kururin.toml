gShooterFireAnim = 0x080C49A0  # u16 animation frames of a shooter firing (a shot on its frame 0x29C)
gShooterShotAnim = 0x080C49E0  # u16 animation frames of a shooter's shot (Object_ShooterShot)
gShooterShotShape = 0x080C49EC  # struct CollisionShape[] of a shooter's shot (Object_ShooterShot)
gItemPalettes = 0x080C6334  # const void *[10]: the 0x20-byte OBJ palette of each item (Bonus_UpdateItem)
gTextGuest = 0x0801E484  # "GUEST": the name Save_ResetFile gives file 0
gTextNoRecordName = 0x0801E4A8  # 9 bytes ("--------"), copied as the name of every reset record (Save_ResetRecords)
gMapCursorAnim = 0x080C470C  # LongAnimFrame[]: the map screen cursor's animation (0x400 bytes of OBJ tiles per frame, MapScreen_UpdateCursor)
# ROM tables documented by KuruTools (tools/research/KuruTools/KuruRomExtractor/
# KuruRomExtractor/Levels.cs), each loaded by the code from its literal pool:
gLevelAreaCounts = 0x0801E740 # NUMBER_AREAS_TABLE_OFFSET: u8[38]; Pause_DemoMenuItem
gLevelTimes = 0x080C293C      # TIMES_TABLE_OFFSET: u16[93 + 38][3]; Save_ResetRecords
gWorldEntries = 0x080C2E68    # WorldEntry.BASE_ADDRESS: 13 x {world info, world data, unk} (12 bytes); Level_Load
gPhysicalTiles = 0x081D8788   # PHYSICAL_TILES_ADDR (0x1DA788 - 0x2000), 0x2000 bytes; Level_Load
gPhysicalTilesChallenge = 0x081DA788  # PHYSICAL_TILES_CHALLENGE_ADDR, 0x2000 bytes; Level_Load

# Sizes of RAM [symbols] objects. A literal-pool word inside one (not at its start) is
# generated as `symbol+offset`, which is what C that indexes the object compiles to.
[symbol_sizes]
gMaps = 0x50          # struct Map[4], 0x14 bytes each (variables.h); Bg_LoadPicture passes &[2]
gBgLayers = 0x70          # 4 x 0x1C-byte layers (Level_Load steps 0x1C); Bg_LoadPicture passes &[2]
gMPlayJumpTable = 0x90         # MPlayFunc[36] (ClearChain/Clear64byte call [34]/[35])
MultiBoot_required_data = 0x6    # u16[3] (MULTIBOOT_NCHILD)
gMain = 0x38                  # struct Main (main.h), up to repeatTimer at +0x34
gCamera = 0x24                # struct Camera (variables.h), up to boundBottom at +0x22
gGameState = 0x40             # struct GameState (variables.h), up to unk3C at +0x3C (Game_Boot copies 0x40 bytes)
gHelirins = 0x330             # struct Helirin[4], 0xCC bytes each (variables.h)
